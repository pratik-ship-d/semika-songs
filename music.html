<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Notes & Songs For You 💖</title>
  
  <!-- Cute Google Font: Fredoka -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Linking your CSS -->
  <link rel="stylesheet" href="audio.css">
</head>
<body>

  <div class="card">
    <h1 class="main-title">Songs of My Favorite Person 🎧✨</h1>

    <div class="song-list">
      
      <div class="song-box">
        <p class="song-title">🎶 You Sang This for Me 🎵</p>
        <audio controls>
          <source src="song.ogg" type="audio/ogg">
        </audio>
      </div>

      <div class="song-box">
        <p class="song-title">🤭 My Fav Muhehehehhe 💕</p>
        <audio controls>
          <source src="song2.mp4" type="audio/mp4">
        </audio>
      </div>

      <div class="song-box">
        <p class="song-title">✨ My Another Fav Muhehehehhe 🌸</p>
        <audio controls>
          <source src="song3.ogg" type="audio/ogg">
        </audio>
      </div>

      <div class="song-box Highlight">
        <p class="song-title">💖 The One That Makes Me Fall for You Even More 💖</p>
        <audio controls>
          <source src="song4.ogg" type="audio/mp4">
        </audio>
      </div>

    </div>

    <a href="index.html" class="back-link">👈 Back to Countdown</a>
    
  </div>
<script>
    // 1. Select all audio elements on the page
    const allAudios = document.querySelectorAll("audio");

    // 2. Loop through every audio player
    allAudios.forEach(function(audio) {
      // 3. Listen for when any audio starts playing
      audio.addEventListener("play", function() {
        // 4. Pause every OTHER audio player that is not the current one
        allAudios.forEach(function(otherAudio) {
          if (otherAudio !== audio) {
            otherAudio.pause();
          }
        });
      });
    });
  </script>
</body>
</html>
</body>
</html>
